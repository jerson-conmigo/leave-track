<!-- TASK-024: password-reset email. The link goes to /auth/confirm, which verifies the token on the server. -->
<h2>Reset your LeaveTrack password</h2>
<p>Someone asked to reset the password for this account. If it was you:</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery"
    >Choose a new password</a
  >
</p>
<p>This link works once and expires soon. If you didn't ask for it, ignore this email.</p>
